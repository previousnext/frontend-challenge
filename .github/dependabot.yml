version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "21:30"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2
    groups:
      pnpm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pnpm-major-deps:
        patterns: ["*"]
        update-types: ["major"]
      pnpm-security-deps:
        applies-to: security-updates
        patterns: ["*"]
