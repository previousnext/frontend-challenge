version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 2
    groups:
      pnpm-deps:
        patterns: [ "*" ]
      pnpm-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
